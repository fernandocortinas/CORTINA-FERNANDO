nte</button></div></div>`}
function refreshColors(which){let n=$(which==='finish'?'eFinish':'eLining').value,cat=which==='finish'?'TECIDO DE ACABAMENTO':'TECIDO DE FORRO',el=$(which==='finish'?'eFinishColor':'eLiningColor');el.innerHTML=opts(colors(cat,n),colors(cat,n)[0]);}
function toggleEnvFields(){let m=$('eModel').value;document.querySelectorAll('.finish-field').forEach(x=>x.classList.toggle('hidden',m==='LINING'));document.querySelectorAll('.lining-field').forEach(x=>x.classList.toggle('hidden',m==='FINISH'))}
function effectivePleat(){let m=$('eModel')?.value||'COMPLETE';return String(m==='LINING'?$('eLiningPleat')?.value:$('eFinishPleat')?.value||'').toUpperCase()}
function isTubePleat(p){return p.includes('ILHÓS')||p.includes('ILHOS')||p.includes('ARGOLAS 19')||p.includes('ARGOLAS 28')||p.includes('ARGOLAS 29')}
function stockHasName(name){return db.stock.some(x=>String(x.name).toUpperCase()===String(name).toUpperCase())}
function trailStockNames(){return [...new Set(db.stock.filter(x=>String(x.name).toUpperCase().startsWith('TRILHO ')&&!/COMANDO|MOTORIZADO/.test(String(x.name).toUpperCase())).map(x=>x.name))]}
function supportQtyWaveRule(wcm){let w=Number(wcm||0);if(w<=200)return 2;if(w<=350)return 3;if(w<=450)return 4;return 5}
function refreshFixationRules(){let el=$('eFix');if(!el)return;let m=$('eModel').value,p=effectivePleat(),arr=[];if(isTubePleat(p)){arr=m==='COMPLETE'?['TUBO 28 + TUBO 19']:['TUBO 19 MM','TUBO 28 MM']}else if(p==='WAVE'||p==='FRANZIDO SUÍÇO'||p==='FRANZIDO SUICO'){arr=['TRILHO SUÍÇO'];if(stockHasName('VARÃO WAVE')||stockHasName('VARAO WAVE'))arr.push('VARÃO WAVE')}else{arr=['TRILHO SUÍÇO'];if(stockHasName('VARÃO WAVE')||stockHasName('VARAO WAVE'))arr.push('VARÃO WAVE')}arr.push('SEM TRILHO E SEM INSTALAÇÃO');let old=el.value;el.innerHTML=opts(arr,arr.includes(old)?old:arr[0]);refreshFixationDetails()}
function refreshFixationDetails(){let kind=$('eFix')?.value||'',tube=kind.startsWith('TUBO'),trail=kind==='TRILHO SUÍÇO',wave=kind==='VARÃO WAVE'||kind==='VARAO WAVE';document.querySelectorAll('.fix-tube-material').forEach(x=>x.classList.toggle('hidden',!tube));document.querySelectorAll('.fix-trail-model').forEach(x=>x.classList.toggle('hidden',!trail));document.querySelectorAll('.fix-wave-mount').forEach(x=>x.classList.toggle('hidden',!wave));if(trail){let ts=trailStockNames(),m=$('eModel').value,preferred=m==='COMPLETE'?'TRILHO DUPLO ESPAÇADO':'TRILHO SIMPLES';$('eTrailModel').innerHTML=opts(ts,ts.includes(preferred)?preferred:ts[0])}refreshFixColors()}
function refreshFixColors(){let kind=$('eFix')?.value||'',namesToCheck=[];if(kind==='TUBO 28 + TUBO 19')namesToCheck=['TUBO 28 MM','TUBO 19 MM'];else if(kind==='TRILHO SUÍÇO')namesToCheck=[$('eTrailModel')?.value];else if(kind==='VARÃO WAVE'||kind==='VARAO WAVE')namesToCheck=['VARÃO WAVE','VARAO WAVE'];else namesToCheck=[kind];let sets=namesToCheck.filter(Boolean).map(n=>new Set(db.stock.filter(x=>String(x.name).toUpperCase()===String(n).toUpperCase()).map(x=>x.color)));let colorsList=sets.length?[...sets[0]].filter(c=>sets.every(z=>z.has(c))):[];if(!colorsList.length)colorsList=['BRANCO'];let el=$('eFixColor'),old=el?.value;if(el)el.innerHTML=opts(colorsList,colorsList.includes(old)?old:colorsList[0])}

function materialRow(p,qty){let unitP4=sale(p);return {sku:p.sku,name:p.name,color:p.color,qty:Number(qty||0),unit:p.unit,unitP4,totalP4:unitP4*Number(qty||0)}}
function fabricCalc(cat,name,color,wcm,hcm,g){let p=product(cat,name,color);if(!p)return {cost:0,cons:0,materials:[]};let gathered=wcm/100*Number(g),fw=Number(p.width||300),cons=gathered;if(hcm+25>fw){let cut=hcm/100*1.10+.10,panels=Math.ceil(gathered/(fw/100));cons=panels*cut}let row=materialRow(p,cons);return {cost:row.totalP4,cons,gathered,materials:[row]}}
function installation(h,w){if(h<=350)return w<=400?60:w<=500?75:95;if(h<=550)return w<=400?160:w<=500?275:395;return w<=400?360:w<=500?475:595}
function fixCalc(kind,color,wcm,model,opt={}){if(kind==='SEM TRILHO E SEM INSTALAÇÃO')return {cost:0,materials:[]};let w=wcm/100,materials=[],add=(name,qty,cat='ACESSÓRIO DE FIXAÇÃO')=>{let p=product(cat,name,color)||product(cat,name,'BRANCO');if(p)materials.push(materialRow(p,qty))};if(kind==='TUBO 28 + TUBO 19'){add('TUBO 28 MM',w);add('TUBO 19 MM',w);let mat=opt.supportMaterial||'PVC';add(`SUPORTE 19/28 ${mat}`,supportQtyWaveRule(wcm));add('TAMPA PARA TUBO EM ALUMINIO 28MM',2);add('TAMPA PARA TUBO EM ALUMINIO 19MM',2)}else if(kind==='TUBO 19 MM'||kind==='TUBO 28 MM'){add(kind,w);let dia=kind.includes('19')?'19MM':'28MM',mat=opt.supportMaterial||'PVC';add(`SUPORTE ${dia} ${mat}`,supportQtyWaveRule(wcm));add(`TAMPA PARA TUBO EM ALUMINIO ${dia}`,2)}else if(kind==='TRILHO SUÍÇO'){let trail=opt.trailModel||'TRILHO SIMPLES',qty=(model==='COMPLETE'&&trail.includes('SIMPLES'))?w*2:w;add(trail,qty);let g=product('ACESSÓRIO DE FIXAÇÃO','GARRA '+trail,color)||product('ACESSÓRIO DE FIXAÇÃO','GARRA '+trail,'BRANCO');if(g)materials.push(materialRow(g,Math.max(2,Math.ceil(w/.6))));let cap=product('ACESSÓRIO DE FIXAÇÃO','TAMPA TRILHO',color)||product('ACESSÓRIO DE FIXAÇÃO','TAMPA TRILHO','BRANCO');if(cap)materials.push(materialRow(cap,(model==='COMPLETE'&&trail.includes('SIMPLES'))?4:2))}else if(kind==='VARÃO WAVE'||kind==='VARAO WAVE'){let nm=stockHasName('VARÃO WAVE')?'VARÃO WAVE':'VARAO WAVE',qty=model==='COMPLETE'?w*2:w;add(nm,qty);if((opt.waveMount||'PAREDE')==='TETO'){let g=product('ACESSÓRIO DE FIXAÇÃO','GARRA PARA VARÃO WAVE',color)||product('ACESSÓRIO DE FIXAÇÃO','GARRA VARÃO WAVE',color)||product('ACESSÓRIO DE FIXAÇÃO','GARRA PARA VARAO WAVE',color)||product('ACESSÓRIO DE FIXAÇÃO','GARRA VARAO WAVE',color);if(g)materials.push(materialRow(g,Math.max(2,Math.ceil(wcm/70)+1)))}else{let sn=model==='COMPLETE'?'SUPORTE DUPLO WAVE':'SUPORTE SIMPLES WAVE';add(sn,supportQtyWaveRule(wcm))}}else{add(kind,w)}return {cost:materials.reduce((a,x)=>a+x.totalP4,0),materials}}
function round4(n){return Math.ceil(Number(n||0)/4)*4}
function waveTapeName(g){let x=Number(g);if(x>=4)return 'FITA WAVE 16X18';if(x>=3.5)return 'FITA WAVE 12X16';if(x>=3)return 'FITA WAVE 10X15';if(x>=2.5)return 'FITA WAVE 12X12';return 'FITA WAVE 10X10'}
function confeccaoCalc(pleat,gather,wcm,model){let materials=[];if(String(pleat).toUpperCase()!=='WAVE')return {materials,cost:0};let w=wcm/100,g=Number(gather||2),tape=product('ACESSÓRIO DE CONFECÇÃO',waveTapeName(g),'SEM COR')||product('ACESSÓRIO DE CONFECÇÃO',waveTapeName(g),'BRANCO');if(tape)materials.push(materialRow(tape,w*g));let cord=product('ACESSÓRIO DE CONFECÇÃO','CORDÃO WAVE 5X5','BRANCO');if(cord)materials.push(materialRow(cord,w));let slide=product('ACESSÓRIO DE CONFECÇÃO','DESLIZANTE WAVE','BRANCO');if(slide){let n=model==='COMPLETE'?round4(Math.ceil(wcm/3)):round4(Math.ceil(wcm/5));materials.push(materialRow(slide,n))}return {materials,cost:materials.reduce((a,x)=>a+x.totalP4,0)}}
function currentEnv(){let w=+$('eWidth').value,h=+$('eHeight').value,m=$('eModel').value;if(!w||!h)return null;let f=m!=='LINING'?fabricCalc('TECIDO DE ACABAMENTO',$('eFinish').value,$('eFinishColor').value,w,h,$('eFinishGather').value):null,l=m!=='FINISH'?fabricCalc('TECIDO DE FORRO',$('eLining').value,$('eLiningColor').value,w,h,$('eLiningGather').value):null;let layers=[f,l].filter(Boolean).length,leaves=+$('eLeaves').value||1,sewM=(h/100*2*leaves*layers)+(f?.gathered||0)+(l?.gathered||0),sew=sewM*(+$('eSew').value||db.settings.sewingPerMeter),fixOpt={supportMaterial:$('eSupportMaterial')?.value||'PVC',trailModel:$('eTrailModel')?.value||'',waveMount:$('eWaveMount')?.value||'PAREDE'},fix=fixCalc($('eFix').value,$('eFixColor').value,w,m,fixOpt),confF=m!=='LINING'?confeccaoCalc($('eFinishPleat').value,$('eFinishGather').value,w,m):{materials:[]},confL=m!=='FINISH'?confeccaoCalc($('eLiningPleat').value,$('eLiningGather').value,w,m):{materials:[]},inst=$('eFix').value==='SEM TRILHO E SEM INSTALAÇÃO'?0:installation(h,w),extra=+$('eExtra').value||0,materials=[...(f?.materials||[]),...(l?.materials||[]),...(fix.materials||[]),...(confF.materials||[]),...(confL.materials||[])],insumosP4=materials.reduce((a,x)=>a+x.totalP4,0),laborP4=sew+inst+extra,p4=insumosP4+laborP4;return {id:crypto.randomUUID(),name:$('eName').value.trim(),width:w,height:h,leaves,angle:$('eAngle').checked,model:m,finish:m!=='LINING'?$('eFinish').value:'',finishColor:m!=='LINING'?$('eFinishColor').value:'',finishPleat:m!=='LINING'?$('eFinishPleat').value:'',finishGather:m!=='LINING'?$('eFinishGather').value:'',lining:m!=='FINISH'?$('eLining').value:'',liningColor:m!=='FINISH'?$('eLiningColor').value:'',liningPleat:m!=='FINISH'?$('eLiningPleat').value:'',liningGather:m!=='FINISH'?$('eLiningGather').value:'',fixation:$('eFix').value,fixColor:$('eFixColor').value,supportMaterial:kind.startsWith('TUBO')?fixOpt.supportMaterial:'',trailModel:kind==='TRILHO SUÍÇO'?fixOpt.trailModel:'',waveMount:(kind==='VARÃO WAVE'||kind==='VARAO WAVE')?fixOpt.waveMount:'',bar:$('eBar').value,extra,sewM,sew,installation:inst,fixCost:fix.cost,materials,insumosP4,laborP4,p4,cash:cash(p4),p10:p10(p4),notes:$('eNotes').value}}
function preview(){let e=currentEnv();$('preview').innerHTML=e?`<b>Cálculo:</b> materiais + fixação + confecção + instalação • Confecção ${money(e.sew)} • Instalação ${money(e.installation)} • <b>4x ${money(e.p4)} • À vista ${money(e.cash)} • 10x ${money(e.p10)}</b>`:'Preencha ambiente, medidas e configuração para visualizar o cálculo.'}
function addEnvironment(){let e=currentEnv();if(!e||!e.name)return alert('Informe ambiente, largura e altura.');draft.environments.push(e);syncClient();render();setTimeout(initQuote,0)}
function totals(){let p4=draft.environments.reduce((a,e)=>a+e.p4,0)+Number(draft.client?.travel||0),disc=Number(draft.client?.discount||0);p4*=1-disc/100;return {p4,cash:cash(p4),p10:p10(p4)}}function summaryMetrics(){let t=totals();return `<div class="summary4"><div class="metric"><small>AMBIENTES</small><strong>${draft.environments.length}</strong></div><div class="metric"><small>10X</small><strong>${money(t.p10)}</strong></div><div class="metric"><small>ATÉ 4X</small><strong>${money(t.p4)}</strong></div><div class="metric"><small>À VISTA</small><strong>${money(t.cash)}</strong></div></div>`}
function summaryTable(){let rows=draft.environments.map((e,i)=>`<tr><td><b>${esc(e.name)}</b></td><td>${e.width} × ${e.height} cm</td><td>${e.model==='COMPLETE'?'Cortina completa':e.model==='LINING'?'Apenas forro':'Apenas acabamento'}</td><td>${esc(e.finish||'—')}</td><td>${esc(e.lining||'—')}</td><td>${esc(e.fixation)}</td><td>${money(e.sew+e.installation)}</td><td>${money(e.p10)}</td><td>${money(e.p4)}</td><td>${money(e.cash)}</td><td class="no-print"><button class="btn danger" onclick="draft.environments.splice(${i},1);render();setTimeout(initQuote,0)">Excluir</button></td></tr>`).join('');return `<div class="card"><div class="section-head">C • Resumo do orçamento</div><div class="table-wrap"><table><tr><th>AMBIENTE</th><th>MEDIDAS</th><th>MODELO</th><th>TECIDO ACABAMENTO</th><th>FORRO</th><th>FIXAÇÃO</th><th>CONFECÇÃO</th><th>10X</th><th>ATÉ 4X</th><th>À VISTA</th><th class="no-print"></th></tr>${rows||'<tr><td colspan="11">Nenhum ambiente adicionado.</td></tr>'}<tr><th colspan="6">TOTAL</th><th></th><th>${money(totals().p10)}</th><th>${money(totals().p4)}</th><th>${money(totals().cash)}</th><th></th></tr></table></div></div>`}
function initQuote(){if(!$('eFinish'))return;refreshColors('finish');refreshColors('lining');toggleEnvFields();refreshFixationRules();preview()}
function saveQuote(print){syncClient();if(!draft.client.name)return alert('Informe o cliente.');if(!draft.environments.length)return alert('Adicione pelo menos um ambiente.');let t=totals(),q={id:crypto.randomUUID(),number:nextNum(db.quotes),...clone(draft.client),environments:clone(draft.environments),p4:t.p4,cash:t.cash,p10:t.p10,status:'Orçamento'};db.quotes.push(q);db.clients.push({name:q.name,phone:q.phone,cpf:q.cpf});save();alert(`Orçamento ${q.number} salvo.`);if(print)printQuote(q);draft={client:{},environments:[]};renderPage('quotes')}
function quotes(){let r=db.quotes.slice().reverse().map(q=>`<tr><td>${q.number}</td><td>${q.date}</td><td>${esc(q.name)}</td><td>${money(q.p10)}</td><td>${money(q.p4)}</td><td>${money(q.cash)}</td><td><button class="btn ghost" onclick="printQuote(db.quotes.find(x=>x.id==='${q.id}'))">PDF</button> <button class="btn primary" onclick="convertOrder('${q.id}')">Converter</button></td></tr>`).join('');return `<div class="card"><div class="section-title">Orçamentos</div><table><tr><th>Nº</th><th>Data</th><th>Cliente</th><th>10x</th><th>4x</th><th>À vista</th><th>Ações</th></tr>${r||'<tr><td colspan=7>Nenhum orçamento.</td></tr>'}</table></div>`}
function aggregateMaterials(envs){let a={};for(const e of envs||[])for(const m of e.materials||[]){let k=m.sku||m.name;a[k]=a[k]||{sku:m.sku,name:m.name,qty:0};a[k].qty+=Number(m.qty||0)}return Object.values(a)}
function consumeOrderStock(order){let need=aggregateMaterials(order.environments),missing=[];for(const n of need){let p=db.stock.find(x=>x.sku===n.sku);if(!p||Number(p.qty)<n.qty)missing.push(`${n.sku||''} ${n.name}: precisa ${n.qty.toFixed(2)}, disponível ${Number(p?.qty||0).toFixed(2)}`)}if(missing.length){alert('Estoque insuficiente para confirmar o pedido:\n\n'+missing.join('\n'));return false}order.stockConsumption=[];for(const n of need){let p=db.stock.find(x=>x.sku===n.sku);p.qty=Number(p.qty)-n.qty;order.stockConsumption.push({...n});db.stockMovements.push({id:crypto.randomUUID(),at:new Date().toISOString(),type:'SAÍDA PEDIDO',order:order.number,sku:n.sku,name:n.name,qty:-n.qty})}return true}
function restoreOrderStock(order){if(order.stockRestored)return;for(const n of order.stockConsumption||[]){let p=db.stock.find(x=>x.sku===n.sku);if(p)p.qty=Number(p.qty)+Number(n.qty);db.stockMovements.push({id:crypto.randomUUID(),at:new Date().toISOString(),type:'ESTORNO PEDIDO',order:order.number,sku:n.sku,name:n.name,qty:Number(n.qty)})}order.stockRestored=true}
function convertOrder(id){let q=db.quotes.find(x=>x.id===id);if(!q)return;let cond=prompt('Condição: digite VISTA, 4X ou 10X','4X')||'4X',val=cond.toUpperCase().includes('VISTA')?q.cash:cond.includes('10')?q.p10:q.p4,o={...clone(q),id:crypto.randomUUID(),number:nextNum(db.orders),quoteNumber:q.number,status:'Pedido',condition:cond,agreedValue:val};if(!consumeOrderStock(o))return;db.orders.push(o);q.status='Convertido';db.receivable.push({id:crypto.randomUUID(),date:q.date,description:`Pedido ${o.number} - ${o.name}`,amount:val,status:'Aberto'});save();renderPage('orders')}
function cancelOrder(id){let o=db.orders.find(x=>x.id===id);if(!o||o.status==='Cancelado')return;if(!confirm('Cancelar este pedido e devolver os materiais ao estoque?'))return;restoreOrderStock(o);o.status='Cancelado';save();renderPage('orders')}
function orders(){let r=db.orders.slice().reverse().map(o=>`<tr><td>${o.number}</td><td>${o.quoteNumber}</td><td>${esc(o.name)}</td><td>${esc(o.condition)}</td><td>${esc(o.status)}</td><td>${money(o.agreedValue)}</td><td><button class="btn ghost" onclick="printQuote(db.orders.find(x=>x.id==='${o.id}'),true)">PDF</button> ${o.status!=='Cancelado'?`<button class="btn danger" onclick="cancelOrder('${o.id}')">Cancelar</button>`:''}</td></tr>`).join('');return `<div class="card"><div class="section-title">Pedidos</div><div class="note">Ao confirmar um pedido, os materiais calculados em cada ambiente são baixados do estoque. O cancelamento estorna as quantidades.</div><br><table><tr><th>Nº</th><th>Orç.</th><th>Cliente</th><th>Condição</th><th>Status</th><th>Valor</th><th>Ação</th></tr>${r||'<tr><td colspan=7>Nenhum pedido.</td></tr>'}</table></div>`}
function conditionKey(q,order){if(!order)return 'p10';let c=String(q.condition||'').toUpperCase();return c.includes('VISTA')?'cash':c.includes('10')?'p10':'p4'}
function condFactor(key){return key==='p10'?p10(1):key==='cash'?cash(1):1}

ide:avoid}h2,h3,h4{color:#075b5b}small{color:#566}.head{display:flex;gap:16px;align-items:center;border-bottom:3px solid #075b5b;padding-bottom:10px}.head img{width:86px}.total{font-size:18px;font-weight:800;color:#075b5b}</style><div class="head"><img src="CORTINA_MARCA.png"><div><h2>${order?'PEDIDO':'ORÇAMENTO'} Nº ${q.number}</h2><b>Cliente:</b> ${esc(q.name)} • ${esc(q.phone||'')}<br><b>Endereço:</b> ${esc([q.street,q.number,q.district,[q.city,q.state].filter(Boolean).join(' / '),q.cep].filter(Boolean).join(', '))}<br><b>Condição:</b> ${condLabel(key)}</div></div>${envs}<div class="total">TOTAL • ${condLabel(key)}: ${money(total)}</div>`;window.print();location.reload()}

function resizePhoto(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let img=new Image();img.onload=()=>{let max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function saveAlbumItem(){let model=aModel.value.trim(),text=aText.value.trim(),files=[...(aPhotos.files||[])];if(!model)return alert('Informe o modelo/título.');if(!files.length)return alert('Adicione pelo menos uma foto.');try{let photos=[];for(const f of files.slice(0,8))photos.push(await resizePhoto(f));db.album=db.album||[];db.album.unshift({id:crypto.randomUUID(),model,text,photos,createdAt:new Date().toISOString()});save();albumMode='view';renderPage('album')}catch(e){alert('Não foi possível salvar as fotos. Tente imagens menores.') }}function deleteAlbumItem(i){if(!confirm('Excluir este item do álbum?'))return;db.album.splice(i,1);save();renderPage('album')}

<div class="card"><div class="section-title">Pastas de saída</div><div class="grid"><div class="c6"><label>Pasta de ORÇAMENTOS</label><div class="actions"><input value="${esc(db.settings.quoteFolder)}" readonly><button class="btn ghost" onclick="chooseFolder('quoteFolder')">SELECIONAR PASTA</button></div></div><div class="c6"><label>Pasta de PEDIDOS</label><div class="actions"><input value="${esc(db.settings.orderFolder)}" readonly><button class="btn ghost" onclick="chooseFolder('orderFolder')">SELECIONAR PASTA</button></div></div></div></div>

// V11.3.2 — ajuste exclusivo da ordem/recolhimento do menu lateral.
(function(){
  const nav=document.getElementById('nav');
  if(!nav) return;

  const desiredOrder=['home','agenda','quote','quotes','orders','install','stock','album','receivable','payable','management'];
  const buttons={};
  nav.querySelectorAll(':scope > button[data-p]').forEach(b=>{ buttons[b.dataset.p]=b; });
  desiredOrder.forEach(key=>{ if(buttons[key]) nav.appendChild(buttons[key]); });

  const stockBtn=buttons.stock;
  const stockSub=document.getElementById('stockSub');
  if(stockBtn && stockSub){
    stockBtn.insertAdjacentElement('afterend',stockSub);
    stockSub.style.display='none';
    stockBtn.setAttribute('aria-expanded','false');

    // Mantém apenas um controle de expansão para o submenu do estoque.
    const cloned=stockBtn.cloneNode(true);
    stockBtn.replaceWith(cloned);
    cloned.addEventListener('click',()=>{
      const isOpen=stockSub.style.display!=='none';
      stockSub.style.display=isOpen?'none':'block';
      cloned.setAttribute('aria-expanded',isOpen?'false':'true');
    });
  }
})();

// ===== CORTINA+ V11.2 - CONSOLIDAÇÃO DE ESTOQUE, ORÇAMENTO E FIXAÇÃO =====
const STOCK_GROUPS=['TODOS','TECIDOS DE ACABAMENTO','TECIDOS DE FORRO','FIXAÇÃO','SUPORTES E TAMPAS','ITENS DE CONFECÇÃO','ACABAMENTO DE BARRA'];
window.stockFilter=window.stockFilter||'TODOS';
function inferStockGroup(x){
  let cat=String(x.category||'').toUpperCase(), n=String(x.name||'').toUpperCase();
  if(cat==='TECIDO DE ACABAMENTO')return 'TECIDOS DE ACABAMENTO';
  if(cat==='TECIDO DE FORRO')return 'TECIDOS DE FORRO';
  if(n==='SOUTACHE'||n.includes('ACABAMENTO DE BARRA'))return 'ACABAMENTO DE BARRA';
  if(/^(TRILHO|TUBO|VARÃO|VARAO)/.test(n))return 'FIXAÇÃO';
  if(/SUPORTE|TAMPA|GARRA/.test(n))return 'SUPORTES E TAMPAS';
  return 'ITENS DE CONFECÇÃO';
}
function legacyCategoryForGroup(g){
  if(g==='TECIDOS DE ACABAMENTO')return 'TECIDO DE ACABAMENTO';
  if(g==='TECIDOS DE FORRO')return 'TECIDO DE FORRO';
  if(g==='ITENS DE CONFECÇÃO'||g==='ACABAMENTO DE BARRA')return 'ACESSÓRIO DE CONFECÇÃO';
  return 'ACESSÓRIO DE FIXAÇÃO';
}
function skuExists(sku){return db.stock.some(x=>x.sku===sku)}
function addStockIfMissing(name,color,group,unit='UN',cost=0,markup=80,qty=200,width=0){
  if(db.stock.some(x=>String(x.name).toUpperCase()===name.toUpperCase()&&String(x.color).toUpperCase()===color.toUpperCase()))return;
  db.stock.push({sku:nextSku(),category:legacyCategoryForGroup(group),stockGroup:group,name,color,unit,qty,width,cost,markup});
}
function migrateV112(){
  db.settings=db.settings||{};
  if(!Number.isFinite(Number(db.settings.cashDiscount)))db.settings.cashDiscount=6;
  if(!Number.isFinite(Number(db.settings.p10Divisor)))db.settings.p10Divisor=.82;
  db.stock=(db.stock||[]).filter(x=>!/COMANDO POR CORDA|MOTORIZADO/.test(String(x.name||'').toUpperCase()));
  db.stock.forEach(x=>x.stockGroup=inferStockGroup(x));
  // Variações pedidas para Varão Wave e seus acessórios
  const waveColors=['PRETO','BRANCO','CROMADO','DOURADO','PRATA ESCOVADO','OURO VELHO'];
  waveColors.forEach(c=>{
    addStockIfMissing('VARÃO WAVE',c,'FIXAÇÃO','M',0,80,30,0);
    addStockIfMissing('SUPORTE SIMPLES WAVE',c,'SUPORTES E TAMPAS','UN',0,80,200,0);
    addStockIfMissing('SUPORTE DUPLO WAVE',c,'SUPORTES E TAMPAS','UN',0,80,200,0);
    addStockIfMissing('TAMPA PARA VARÃO WAVE',c,'SUPORTES E TAMPAS','UN',0,80,200,0);
  });
  ['BRANCO','PRETO'].forEach(c=>addStockIfMissing('GARRA PARA VARÃO WAVE',c,'SUPORTES E TAMPAS','UN',0,80,200,0));
  // Garras específicas por família de trilho
  ['TRILHO SIMPLES','TRILHO DUPLO ESTREITO','TRILHO DUPLO LARGO','TRILHO TRIPLO'].forEach(t=>{
    ['BRANCO','PRETO'].forEach(c=>addStockIfMissing('GARRA '+t,c,'SUPORTES E TAMPAS','UN',3.18,91.33,200,0));
  });
  // Novos modelos de trilho para equivaler às garras definidas
  ['TRILHO DUPLO ESTREITO','TRILHO DUPLO LARGO'].forEach(t=>['BRANCO','PRETO'].forEach(c=>addStockIfMissing(t,c,'FIXAÇÃO','M',29.68,92,30,0)));
  // Suportes adicionais 19/19
  ['PVC','ALUMINIO'].forEach(mat=>['PRATA ESCOVADO','CROMADO','DOURADO','MARFIM','IMBUIA','CEREJEIRA','OURO VELHO','BRANCO','PRETO'].forEach(c=>addStockIfMissing(`SUPORTE 19/19 ${mat}`,c,'SUPORTES E TAMPAS','UN',0,142,200,0)));
  // Cores adicionais de argolas e ilhós
  const metalColors=['PRATA ESCOVADO','CROMADO','DOURADO','MARFIM','IMBUIA','CEREJEIRA','OURO VELHO','BRANCO','PRETO'];
  metalColors.forEach(c=>{
    addStockIfMissing('ARGOLA 19MM',c,'ITENS DE CONFECÇÃO','UN',.69,142,200,0);
    addStockIfMissing('ARGOLA 28MM',c,'ITENS DE CONFECÇÃO','UN',.95,142,200,0);
    addStockIfMissing('ILHOS QUADRADO',c,'ITENS DE CONFECÇÃO','UN',.95,142,200,0);
    addStockIfMissing('ILHOS REDONDO',c,'ITENS DE CONFECÇÃO','UN',1.01,142,200,0);
  });
  // Deslizantes por formato/cor
  ['DESLIZANTE PRETO REDONDO','DESLIZANTE BRANCO REDONDO','DESLIZANTE PRETO QUADRADO','DESLIZANTE BRANCO QUADRADO'].forEach(n=>addStockIfMissing(n,'SEM COR','ITENS DE CONFECÇÃO','UN',.24,112,200,0));
  // Fitas Wave e entretela conforme nova tabela
  [['FITA WAVE 10X10',2.65],['FITA WAVE 12X12',2.65],['FITA WAVE 10X15',2.65],['FITA WAVE 12X16',2.65],['FITA WAVE 12X18',2.65],['FITA WAVE 18X18',2.65]].forEach(([n,cost])=>addStockIfMissing(n,'SEM COR','ITENS DE CONFECÇÃO','M',cost,112,300,0));
  addStockIfMissing('ENTRETELA','SEM COR','ITENS DE CONFECÇÃO','M',0,112,300,0);
  ['NUDE','FENDI','DOURADO','CINZA','OFF'].forEach(c=>addStockIfMissing('SOUTACHE',c,'ACABAMENTO DE BARRA','M',.64,112,300,0));
  // Garante sequência persistente de orçamento iniciando em 2026001
  let maxExisting=Math.max(2026000,...(db.quotes||[]).map(q=>Number(q.number)||0).filter(n=>n>=2026001));
  if(!Number(db.settings.nextQuoteNumber)||Number(db.settings.nextQuoteNumber)<=maxExisting)db.settings.nextQuoteNumber=maxExisting+1;
  save();
}

waveTapeName=function(g){let x=Number(g);if(x>=4)return 'FITA WAVE 18X18';if(x>=3.5)return 'FITA WAVE 12X18';if(x>=3)return 'FITA WAVE 12X16';if(x>=2.5)return 'FITA WAVE 10X15';if(x>=2)return 'FITA WAVE 12X12';return 'FITA WAVE 10X10'};
confeccaoCalc=function(pleat,gather,wcm,model){let materials=[];if(String(pleat).toUpperCase()!=='WAVE')return {materials,cost:0};let w=wcm/100,g=Number(gather||2),tapeQty=w*g,tape=product('ACESSÓRIO DE CONFECÇÃO',waveTapeName(g),'SEM COR')||product('ACESSÓRIO DE CONFECÇÃO',waveTapeName(g),'BRANCO');if(tape)materials.push(materialRow(tape,tapeQty));let ent=product('ACESSÓRIO DE CONFECÇÃO','ENTRETELA','SEM COR')||product('ACESSÓRIO DE CONFECÇÃO','ENTRETELA','BRANCO');if(ent)materials.push(materialRow(ent,tapeQty));let cord=product('ACESSÓRIO DE CONFECÇÃO','CORDÃO WAVE 5X5','BRANCO');if(cord)materials.push(materialRow(cord,w));let slide=product('ACESSÓRIO DE CONFECÇÃO','DESLIZANTE WAVE','BRANCO')||product('ACESSÓRIO DE CONFECÇÃO','DESLIZANTE BRANCO REDONDO','SEM COR');if(slide){let n=model==='COMPLETE'?round4(Math.ceil(wcm/3)):round4(Math.ceil(wcm/5));materials.push(materialRow(slide,n))}return {materials,cost:materials.reduce((a,x)=>a+x.totalP4,0)}};

refreshFixationRules=function(){let el=$('eFix');if(!el)return;let m=$('eModel').value,p=effectivePleat(),arr=[];if(isTubePleat(p)){arr=m==='COMPLETE'?['TUBO 28 + TUBO 19']:['TUBO 19 MM','TUBO 28 MM']}else if(p==='WAVE'||p==='FRANZIDO SUÍÇO'||p==='FRANZIDO SUICO'){arr=['TRILHO SUÍÇO','VARÃO WAVE']}else{arr=['TRILHO SUÍÇO','VARÃO WAVE']}arr.push('SEM TRILHO E SEM INSTALAÇÃO');let old=el.value;el.innerHTML=opts(arr,arr.includes(old)?old:arr[0]);refreshFixationDetails()};

fixCalc=function(kind,color,wcm,model,opt={}){if(kind==='SEM TRILHO E SEM INSTALAÇÃO')return {cost:0,materials:[]};let w=wcm/100,materials=[],add=(name,qty,cat='ACESSÓRIO DE FIXAÇÃO')=>{let p=product(cat,name,color)||product(cat,name,'BRANCO')||db.stock.find(x=>String(x.name).toUpperCase()===String(name).toUpperCase()&&String(x.color).toUpperCase()===String(color).toUpperCase())||db.stock.find(x=>String(x.name).toUpperCase()===String(name).toUpperCase());if(p)materials.push(materialRow(p,qty))};if(kind==='TUBO 28 + TUBO 19'){add('TUBO 28 MM',w);add('TUBO 19 MM',w);let mat=opt.supportMaterial||'PVC';add(`SUPORTE 19/28 ${mat}`,supportQtyWaveRule(wcm));add('TAMPA PARA TUBO EM ALUMINIO 28MM',2);add('TAMPA PARA TUBO EM ALUMINIO 19MM',2)}else if(kind==='TUBO 19 MM'||kind==='TUBO 28 MM'){add(kind,w);let dia=kind.includes('19')?'19MM':'28MM',mat=opt.supportMaterial||'PVC';add(`SUPORTE ${dia} ${mat}`,supportQtyWaveRule(wcm));add(`TAMPA PARA TUBO EM ALUMINIO ${dia}`,2)}else if(kind==='TRILHO SUÍÇO'){let trail=opt.trailModel||'TRILHO SIMPLES',qty=(model==='COMPLETE'&&trail.includes('SIMPLES'))?w*2:w;add(trail,qty);let garraName='GARRA '+trail;let g=db.stock.find(x=>String(x.name).toUpperCase()===garraName.toUpperCase()&&String(x.color).toUpperCase()===String(color).toUpperCase())||db.stock.find(x=>String(x.name).toUpperCase()===garraName.toUpperCase()&&String(x.color).toUpperCase()==='BRANCO');if(g)materials.push(materialRow(g,Math.max(2,Math.ceil(w/.6))));let cap=product('ACESSÓRIO DE FIXAÇÃO','TAMPA TRILHO',color)||product('ACESSÓRIO DE FIXAÇÃO','TAMPA TRILHO','BRANCO');if(cap)materials.push(materialRow(cap,(model==='COMPLETE'&&trail.includes('SIMPLES'))?4:2))}else if(kind==='VARÃO WAVE'||kind==='VARAO WAVE'){let qty=model==='COMPLETE'?w*2:w;add('VARÃO WAVE',qty);if((opt.waveMount||'PAREDE')==='TETO'){let g=db.stock.find(x=>String(x.name).toUpperCase()==='GARRA PARA VARÃO WAVE'&&String(x.color).toUpperCase()===String(color).toUpperCase())||db.stock.find(x=>String(x.name).toU function migrateV113(){

  // compatibilidades e cores das famílias de argolas/ilhós
  const metal=['PRATA ESCOVADO','CROMADO','DOURADO','MARFIM','IMBUIA','CEREJEIRA','OURO VELHO','BRANCO','PRETO'];
  metal.forEach(c=>{
    addStockIfMissing('ARGOLA 19MM',c,'ITENS DE CONFECÇÃO','UN',.69,142,200,0);

// Materiais automáticos de confecção: fita/entretela, ilhós e argolas.
confeccaoCalc=function(pleat,gather,wcm,model,color){
  let materials=[], p=normalizeText113(pleat), w=Number(wcm||0)/100, g=Number(gather||1), chosen=color||'BRANCO';
  const push=(prod,qty)=>{if(prod&&qty>0)materials.push(materialRow(prod,qty))};
  if(p==='WAVE'){
    let tapeQty=w*g;
    push(findStock113(waveTapeName(g),'SEM COR'),tapeQty);
    push(findStock113('ENTRETELA','SEM COR'),tapeQty);
    let cord=findStock113('CORDÃO WAVE 5X5','BRANCO'); if(cord)push(cord,w);
    let slide=findStock113(['DESLIZANTE WAVE','DESLIZANTE BRANCO REDONDO'],'BRANCO');
    if(slide){let n=model==='COMPLETE'?round4(Math.ceil(wcm/3)):round4(Math.ceil(wcm/5));push(slide,n)}
  } else if(p.includes('ILHOS')){
    // 1 ilhós para cada 14 cm de tecido; ilhós exige franzimento 3:1.
    let qty=nextEvenAbove113((Number(wcm||0)*3)/14);
    push(findStock113(p.includes('QUADRADO')?'ILHOS QUADRADO':'ILHOS REDONDO',chosen),qty);
  } else if(p.includes('ARGOLAS 19')){
    let qty=nextEvenAbove113(Number(wcm||0)/7);
    push(findStock113(['ARGOLA 19MM','ARGOLAS 19MM'],chosen),qty);
  } else if(p.includes('ARGOLAS 28')||p.includes('ARGOLAS 29')){
    let qty=nextEvenAbove113(Number(wcm||0)/7);
    push(findStock113(['ARGOLA 28MM','ARGOLAS 28MM','ARGOLA 29MM'],chosen),qty);
  }
  return {materials,cost:materials.reduce((a,x)=>a+x.totalP4,0)};
};

// Regras definitivas de fixação.
fixCalc=function(kind,color,wcm,model,opt={}){
  if(kind==='SEM TRILHO E SEM INSTALAÇÃO')return {cost:0,materials:[]};
  let w=wcm/100,materials=[];
  const find=(names,col=color)=>{
    names=Array.isArray(names)?names:[names];
    const wanted=names.map(norm=>String(norm).toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));
    const c=String(col||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    return db.stock.find(x=>wanted.includes(String(x.name).toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''))&&String(x.color).toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')===c)
      ||db.stock.find(x=>wanted.includes(String(x.name).toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''))&&String(x.color).toUpperCase()==='BRANCO')
      ||db.stock.find(x=>wanted.includes(String(x.name).toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')));
  };
  const add=(names,qty)=>{let p=find(names);if(p)materials.push(materialRow(p,qty));};

  if(kind==='TUBO 28 + TUBO 19'){
    add('TUBO 28 MM',w);add('TUBO 19 MM',w);
    const mat=opt.supportMaterial||'PVC';
    add(`SUPORTE 19/28 ${mat}`,supportQtyWaveRule(wcm));
    add(['PONTEIRA PARA TUBO 28MM','TAMPA PARA TUBO EM ALUMINIO 28MM'],2);
    add(['PONTEIRA PARA TUBO 19MM','TAMPA PARA TUBO EM ALUMINIO 19MM'],2);
  }else if(kind==='TUBO 19 MM'||kind==='TUBO 28 MM'){
    add(kind,w);
    const dia=kind.includes('19')?'19MM':'28MM',mat=opt.supportMaterial||'PVC';
    add(`SUPORTE ${dia} ${mat}`,supportQtyWaveRule(wcm));
    add([`PONTEIRA PARA TUBO ${dia}`,`TAMPA PARA TUBO EM ALUMINIO ${dia}`],2);
  }else if(kind==='TRILHO SUÍÇO'){
    // Trilho suíço é SEMPRE teto / alumínio. PVC/PAREDE não participam desta regra.
    const trail=opt.trailModel||'TRILHO SIMPLES',qty=(model==='COMPLETE'&&trail.includes('SIMPLES'))?w*2:w;
    add(trail,qty);
    add('GARRA '+trail,Math.max(2,Math.ceil(w/.6)));
    add('TAMPA TRILHO',(model==='COMPLETE'&&trail.includes('SIMPLES'))?4:2);
  }else if(kind==='VARÃO WAVE'||kind==='VARAO WAVE'){
    const qty=model==='COMPLETE'?w*2:w;
    add(['VARÃO WAVE','VARAO WAVE'],qty);
    if((opt.waveMount||'PAREDE')==='TETO'){
      // Teto: usa garra para Varão Wave.
      add(['GARRA PARA VARÃO WAVE','GARRA VARÃO WAVE','GARRA PARA VARAO WAVE','GARRA VARAO WAVE'],Math.max(2,Math.ceil(wcm/70)+1));
    }else{
      // Parede: usa suporte Wave conforme a tabela de quantidade por largura.
      add(model==='COMPLETE'?'SUPORTE DUPLO WAVE':'SUPORTE SIMPLES WAVE',supportQtyWaveRule(wcm));
    }
    add(['TAMPA PARA VARÃO WAVE','TAMPA PARA VARAO WAVE'],model==='COMPLETE'?4:2);
  }else add(kind,w);
  return {cost:materials.reduce((a,x)=>a+x.totalP4,0),materials};
};

function v116OrderConditionKey(q){
  const c=String(q.conditionCode||'').toUpperCase();
  if(c==='PIX') return 'cash';
  if(c==='CREDITO'||c==='2X'||c==='3X'||c==='4X') return 'p4';
  return 'p10'; // 5x a 10x usam a mesma base comercial de 10x.
}
function v116OrderConditionLabel(q){
  const c=String(q.conditionCode||'').toUpperCase();
  if(c==='PIX') return 'À VISTA (PIX/DINHEIRO)';
  if(c==='CREDITO') return 'CRÉDITO À VISTA';
  const n=parseInt(c,10);
  return Number.isFinite(n) ? `${n}x` : (q.condition||'CONDIÇÃO SELECIONADA');
}
function v116ConditionFactor(key){
  const base=100;
  if(key==='cash') return cash(base)/base;
  if(key==='p10') return p10(base)/base;
  return 1;
}
function v116EnvBaseByKey(e,key){
  if(key==='cash') return Number(e.cash!=null?e.cash:cash(Number(e.p4||0)));
  if(key==='p10') return Number(e.p10!=null?e.p10:p10(Number(e.p4||0)));
  return Number(e.p4||0);
}

// ===== CORTINA+ V11.7 — PADRONIZAÇÃO OFICIAL DOS VALORES DE VENDA EM 4X =====
(function(){
  const norm117=v=>String(v||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const setP4=(matcher,p4)=>{
    (db.stock||[]).forEach(x=>{
      if(matcher(x)){
        // O motor calcula preço 4x por custo * (1 + markup/100).
        // Mantemos markup em 100% e gravamos metade do preço-base como custo técnico,
        // garantindo que o valor comercial em 4x seja exatamente o valor informado.
        x.cost=Number(p4)/2;
        x.markup=100;
        x.stockGroup=inferStockGroup(x);
      }
    });
  };
  const byName=(...names)=>{const w=names.map(norm117);return x=>w.includes(norm117(x.name));};

  // Tecidos — mesmos valores para todas as cores da mesma natureza.
  setP4(byName('LINHO SINTÉTICO'),45);
  setP4(byName('LINHO COMPOSTO 6%','LINHO 6%'),62);
  setP4(byName('LINHO COMPOSTO 12%','LINHO 12%'),75);
  setP4(byName('LINHO NACIONAL'),95);
  setP4(byName('GABARDINE'),48);
  setP4(byName('BLACKOUT 100% LEVE'),65);
  setP4(byName('BLACKOUT 100% PESADO'),90);
  setP4(byName('BLACKOUT 100% WIDE','BLACKOUT 100% LEVE WIDE'),90);
  setP4(byName('VOIL LISO'),25);
  setP4(byName('VOIL SUPER'),30);
  setP4(byName('VOIL TRABALHADO COMPOSTO','VOIL TRABALHADO'),40);

  // Linhos WIDE: garante a família no estoque e replica as cores do equivalente normal.
  const ensureWideFamily=(regularName,wideName,p4)=>{
    const base=(db.stock||[]).filter(x=>norm117(x.name)===norm117(regularName));
    if(!(db.stock||[]).some(x=>norm117(x.name)===norm117(wideName))){
      base.forEach(x=>addStockIfMissing(wideName,x.color,'TECIDOS DE ACABAMENTO','M',Number(p4)/2,100,Number(x.qty||300),wideName==='LINHO SINTÉTICO WIDE'?330:320));
    }
    setP4(byName(wideName),p4);
  };
  ensureWideFamily('LINHO SINTÉTICO','LINHO SINTÉTICO WIDE',49.50);
  ensureWideFamily('LINHO COMPOSTO 6%','LINHO COMPOSTO 6% WIDE',75);
  (db.stock||[]).filter(x=>norm117(x.name)==='LINHO SINTETICO').forEach(base=>{
    let wide=(db.stock||[]).find(x=>norm117(x.name)==='LINHO SINTETICO WIDE'&&norm117(x.color)===norm117(base.color));
    if(!wide){addStockIfMissing('LINHO SINTÉTICO WIDE',base.color,'TECIDOS DE ACABAMENTO','M',24.75,100,Number(base.qty||300),330);
      wide=(db.stock||[]).find(x=>norm117(x.name)==='LINHO SINTETICO WIDE'&&norm117(x.color)===norm117(base.color));}
    if(wide){wide.width=330;wide.cost=24.75;wide.markup=100;wide.category='TECIDO DE ACABAMENTO';wide.stockGroup='TECIDOS DE ACABAMENTO';}
  });

  // Varão Wave e acessórios.
  setP4(byName('VARÃO WAVE','VARAO WAVE'),37);
  setP4(byName('TAMPA PARA VARÃO WAVE','TAMPA PARA VARAO WAVE'),12);
  setP4(byName('SUPORTE SIMPLES WAVE'),28);
  setP4(byName('SUPORTE DUPLO WAVE'),38);

  // Trilho suíço — valores definidos especificamente pelo usuário.
  setP4(byName('TRILHO DUPLO ESPAÇADO'),35);
  setP4(byName('TRILHO TRIPLO'),35);
  setP4(byName('TRILHO 3 VIAS'),40);
  setP4(byName('TAMPA TRILHO'),9.50);

  // Tubos 19/28 — suportes e ponteiras.
  setP4(byName('SUPORTE 19MM ALUMINIO'),22);
  setP4(byName('SUPORTE 28MM ALUMINIO'),35);
  setP4(byName('SUPORTE 19MM PVC'),12);
  setP4(byName('SUPORTE 19/28 PVC'),18);
  setP4(byName('PONTEIRA PARA TUBO 19MM','TAMPA PARA TUBO EM ALUMINIO 19MM'),9.80);
  setP4(byName('PONTEIRA PARA TUBO 28MM','TAMPA PARA TUBO EM ALUMINIO 28MM'),9.80);

  db.version='11.7';
  db.settings=db.settings||{};
  db.settings.v117PriceTableApplied=true;
  save();
})();

(function(){

const stores={};
function database(){return new Promise(function(resolve,reject){
  if(!window.indexedDB)return reject(new Error('Armazenamento de permissoes indisponivel'));
  const req=indexedDB.open('cortina_pastas_v1195',1);
  req.onupgradeneeded=function(){if(!req.result.objectStoreNames.contains('pasta'))req.result.createObjectStore('pasta');};
  req.onsuccess=function(){resolve(req.result);};req.onerror=function(){reject(req.error);};
});}
async function storeHandle(key,handle){const db=await database();return new Promise((resolve,reject)=>{const tx=db.transaction('pasta','readwrite');tx.objectStore('pasta').put(handle,key);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};});}
async function getHandle(key){if(stores[key])return stores[key];const db=await database();return new Promise((resolve,reject)=>{const tx=db.transaction('pasta','readonly');const req=tx.objectStore('pasta').get(key);req.onsuccess=()=>{db.close();stores[key]=req.result;resolve(req.result);};req.onerror=()=>{db.close();reject(req.error);};});}
async function allowed(handle){if(!handle)return false;try{if(await handle.queryPermission({mode:'readwrite'})==='granted')return true;return await handle.requestPermission({mode:'readwrite'})==='granted';}catch(e){return false;}}
function category(filename){const name=String(filename||'').toUpperCase();if(name.startsWith('BACKUP'))return 'backup';if(name.startsWith('PEDIDO'))return 'orders';if(name.startsWith('FOTO'))return 'photos';if(name.startsWith('PRODUCAO')||name.startsWith('ETIQUETAS'))return 'production';return 'quotes';}

container.id='cortina-folder-selector-1195';container.querySelectorAll('[data-folderchoose]').forEach(b=>b.onclick=async function(){const key=b.dataset.folderchoose;if(!window.showDirectoryPicker){alert('Este navegador nao permite escolher pastas diretamente. A gravacao automatica exige um navegador compativel ou integracao desktop.');return;}

categories.forEach(async ([key])=>{try{const v=await getHandle(key);if(v){const label=container.querySelector('[data-folderstate="'+key+'"]');if(label)label.textContent=v.name+' (requer permissao ao salvar)';}}catch(e){}});
}

window.cortinaSaveDocument1195=async function(name,content,type,fallback){
// A API do navegador nao transforma HTML em PDF. O organizador desktop
